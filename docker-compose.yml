version: '3.8'

services:
  kicad-host:
    image: kicad/kicad:9.0
    command: kicad --headless --ipc-server-port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./projects:/projects
    networks:
      - circuitpilot-net
    healthcheck:
      test: ["CMD", "sh", "-c", "echo '' > /dev/tcp/localhost/5000 2>/dev/null && echo ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./projects:/projects
    environment:
      - KICAD_IPC_HOST=kicad-host
      - KICAD_IPC_PORT=5000
    depends_on:
      kicad-host:
        condition: service_healthy
    networks:
      - circuitpilot-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - circuitpilot-net

networks:
  circuitpilot-net:
    driver: bridge
